name: Build HZ Spawn Control

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Сборка мода
        run: gradle build --stacktrace

      - name: Загрузка готового JAR
        uses: actions/upload-artifact@v4
        with:
          name: hz-spawn-control-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
